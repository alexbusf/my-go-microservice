version: '3.8'

services:
  # Ваше Go-приложение
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Передаем адрес БД. Важно: имя хоста должно совпадать с именем сервиса ниже (db)
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=gouser
      - DB_PASSWORD=secret
      - DB_NAME=mydb
      - PORT=8080
    depends_on:
      # Говорим Docker: не запускай "app", пока не запущен "db"
      - db

  # Сама база данных PostgreSQL
  db:
    image: postgres:16-alpine # Легковесная версия
    restart: unless-stopped
    environment:
      POSTGRES_USER: gouser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydb
    ports:
      # Пробрасываем порт БД, чтобы к ней можно было подключиться из GUI
      - "5432:5432"
    volumes:
      # Сохраняем данные БД на диск, чтобы они не стерлись при перезапуске
      - pgdata:/var/lib/postgresql/data
      
      # - ./db/seed/init.sql:/docker-entrypoint-initdb.d/1-init.sql

  # Графический интерфейс для базы данных
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      # Логин и пароль для входа в сам pgAdmin в браузере
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin-secret
    ports:
      - "5050:80" # pgAdmin запустится на http://localhost:5050
    depends_on:
      - db

# Объявление тома для хранения данных БД
volumes:
  pgdata: